<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACDS - Academic & Career Development System</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
/* ============================================================
   ACDS - Academic & Career Development System
   Complete Stylesheet
   ============================================================ */

/* CSS Reset & Variables */
:root {
  --primary: #1565C0;
  --secondary: #0D47A1;
  --accent: #42A5F5;
  --success: #2E7D32;
  --warning: #F57F17;
  --danger: #C62828;
  --bg: #F5F7FA;
  --card: #FFFFFF;
  --text: #263238;
  --text-light: #607D8B;
  --border: #E0E0E0;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
  --radius: 12px;
  --radius-sm: 8px;
  --sidebar-w: 260px;
  --navbar-h: 60px;
  --transition: all 0.3s ease;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
}

/* ===================== LOGIN PAGE ===================== */
#loginPage {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 50%, var(--accent) 100%);
  position: relative;
  overflow: hidden;
}

#loginPage::before {
  content: '';
  position: absolute;
  width: 600px; height: 600px;
  background: rgba(255,255,255,0.03);
  border-radius: 50%;
  top: -200px; right: -200px;
}

#loginPage::after {
  content: '';
  position: absolute;
  width: 400px; height: 400px;
  background: rgba(255,255,255,0.03);
  border-radius: 50%;
  bottom: -100px; left: -100px;
}

.login-box {
  background: var(--card);
  border-radius: 20px;
  padding: 48px 40px;
  width: 420px;
  max-width: 95vw;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  position: relative;
  z-index: 1;
  text-align: center;
}

.login-logo {
  font-size: 48px;
  margin-bottom: 8px;
}

.login-box h1 {
  font-size: 24px;
  color: var(--primary);
  margin-bottom: 4px;
  font-weight: 700;
}

.login-box .subtitle {
  color: var(--text-light);
  font-size: 13px;
  margin-bottom: 32px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 20px;
}
@media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

.form-group {
  margin-bottom: 18px;
  text-align: left;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  transition: var(--transition);
  outline: none;
  font-family: inherit;
}

.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(21,101,192,0.1);
}

.form-group textarea { resize: vertical; min-height: 80px; }

.btn {
  padding: 12px 24px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: inherit;
}

.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--secondary); transform: translateY(-1px); box-shadow: var(--shadow); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #1B5E20; }
.btn-warning { background: var(--warning); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #B71C1C; }
.btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
.btn-outline:hover { background: var(--primary); color: #fff; }
.btn-sm { padding: 8px 16px; font-size: 12px; }
.btn-full { width: 100%; justify-content: center; }

.btn-icon {
  width: 36px; height: 36px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card);
  cursor: pointer;
  transition: var(--transition);
  font-size: 16px;
}
.btn-icon:hover { background: var(--bg); }

.login-roles {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  margin-top: 16px;
}

.login-roles button {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--bg);
  font-size: 11px;
  cursor: pointer;
  transition: var(--transition);
  color: var(--text);
}
.login-roles button:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ===================== MAIN APP LAYOUT ===================== */
#appPage { display: none; }

.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--navbar-h);
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  z-index: 100;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}

.navbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 18px;
  color: var(--primary);
  min-width: var(--sidebar-w);
}

.navbar-brand span { font-size: 24px; }

.menu-toggle {
  display: none;
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--text);
  margin-right: 12px;
}

.navbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 16px;
}

.navbar-user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 14px;
  background: var(--bg);
  border-radius: 24px;
  cursor: default;
}

.navbar-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
}

.navbar-user-info { line-height: 1.2; }
.navbar-user-info .name { font-size: 13px; font-weight: 600; }
.navbar-user-info .role { font-size: 11px; color: var(--text-light); }

.btn-logout {
  padding: 8px 16px;
  background: none;
  border: 1px solid var(--danger);
  color: var(--danger);
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}
.btn-logout:hover { background: var(--danger); color: #fff; }

/* ===================== SIDEBAR ===================== */
.sidebar {
  position: fixed;
  top: var(--navbar-h);
  left: 0;
  width: var(--sidebar-w);
  height: calc(100vh - var(--navbar-h));
  background: var(--card);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  z-index: 90;
  transition: var(--transition);
  padding: 16px 0;
}

.sidebar-menu { list-style: none; }

.sidebar-menu li a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 24px;
  color: var(--text);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  transition: var(--transition);
  border-left: 3px solid transparent;
}

.sidebar-menu li a:hover {
  background: rgba(21,101,192,0.05);
  color: var(--primary);
}

.sidebar-menu li a.active {
  background: rgba(21,101,192,0.08);
  color: var(--primary);
  border-left-color: var(--primary);
  font-weight: 600;
}

.sidebar-menu li a .icon {
  font-size: 20px;
  width: 28px;
  text-align: center;
}

.sidebar-divider {
  height: 1px;
  background: var(--border);
  margin: 12px 24px;
}

.sidebar-section-title {
  padding: 8px 24px 4px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-light);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ===================== MAIN CONTENT ===================== */
.main-content {
  margin-left: var(--sidebar-w);
  margin-top: var(--navbar-h);
  padding: 24px;
  min-height: calc(100vh - var(--navbar-h));
}

.page { display: none; }
.page.active { display: block; animation: fadeIn 0.3s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.page-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}

.page-subtitle {
  color: var(--text-light);
  font-size: 14px;
  margin-bottom: 24px;
}

/* Cards */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px;
  margin-bottom: 20px;
  transition: var(--transition);
}

.card:hover { box-shadow: var(--shadow-lg); }

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.card-header h3 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}

.card-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 16px;
}

/* Stat Cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 16px;
  transition: var(--transition);
  border-left: 4px solid var(--primary);
}

.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }

.stat-card.green { border-left-color: var(--success); }
.stat-card.amber { border-left-color: var(--warning); }
.stat-card.red { border-left-color: var(--danger); }
.stat-card.blue { border-left-color: var(--accent); }

.stat-icon {
  width: 48px; height: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  background: rgba(21,101,192,0.1);
  color: var(--primary);
  flex-shrink: 0;
}

.stat-card.green .stat-icon { background: rgba(46,125,50,0.1); color: var(--success); }
.stat-card.amber .stat-icon { background: rgba(245,127,23,0.1); color: var(--warning); }

.stat-info { flex: 1; }
.stat-value { font-size: 28px; font-weight: 700; line-height: 1.2; }
.stat-label { font-size: 12px; color: var(--text-light); font-weight: 500; }

/* Grid layouts */
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

/* Tables */
.table-container {
  overflow-x: auto;
  border-radius: var(--radius-sm);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

table th {
  background: var(--bg);
  padding: 12px 14px;
  text-align: left;
  font-weight: 600;
  color: var(--text);
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}

table td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}

table tbody tr:hover { background: rgba(21,101,192,0.03); }

.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}

.badge-blue { background: rgba(21,101,192,0.1); color: var(--primary); }
.badge-green { background: rgba(46,125,50,0.1); color: var(--success); }
.badge-amber { background: rgba(245,127,23,0.1); color: var(--warning); }
.badge-red { background: rgba(198,40,40,0.1); color: var(--danger); }

/* Toolbar */
.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.toolbar .search-box {
  flex: 1;
  min-width: 200px;
  position: relative;
}

.toolbar .search-box input {
  width: 100%;
  padding: 10px 14px 10px 38px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  outline: none;
  transition: var(--transition);
}

.toolbar .search-box input:focus { border-color: var(--primary); }

.toolbar .search-box::before {
  content: '🔍';
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
}

.toolbar select {
  padding: 10px 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  outline: none;
  background: var(--card);
  cursor: pointer;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.2s ease;
}

.modal-overlay.show { display: flex; }

.modal {
  background: var(--card);
  border-radius: var(--radius);
  width: 600px;
  max-width: 95vw;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
}

.modal-header h3 { font-size: 18px; font-weight: 700; }

.modal-close {
  width: 32px; height: 32px;
  border: none;
  background: var(--bg);
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

.modal-close:hover { background: var(--danger); color: #fff; }

.modal-body { padding: 24px; }

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  padding: 16px 24px;
  border-top: 1px solid var(--border);
}

/* Toast */
.toast-container {
  position: fixed;
  top: 80px;
  right: 24px;
  z-index: 300;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast {
  padding: 14px 20px;
  border-radius: var(--radius-sm);
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  animation: slideInRight 0.3s ease;
  min-width: 280px;
  display: flex;
  align-items: center;
  gap: 10px;
}

@keyframes slideInRight {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

.toast-success { background: var(--success); }
.toast-error { background: var(--danger); }
.toast-info { background: var(--primary); }
.toast-warning { background: var(--warning); }

/* Progress bar */
.progress-bar {
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
  margin: 8px 0;
}

.progress-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.5s ease;
  background: var(--primary);
}

.progress-fill.green { background: var(--success); }
.progress-fill.amber { background: var(--warning); }

/* Profile section */
.profile-header {
  display: flex;
  gap: 24px;
  align-items: center;
  margin-bottom: 24px;
}

.profile-avatar {
  width: 100px; height: 100px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  color: #fff;
  flex-shrink: 0;
}

.profile-info h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.profile-info p { color: var(--text-light); font-size: 14px; }

.info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 12px;
}

.info-item {
  padding: 12px;
  background: var(--bg);
  border-radius: var(--radius-sm);
}

.info-item label {
  display: block;
  font-size: 11px;
  color: var(--text-light);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-bottom: 4px;
}

.info-item span { font-size: 14px; font-weight: 500; }

/* Tabs */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 20px;
  border-bottom: 2px solid var(--border);
  overflow-x: auto;
}

.tab-btn {
  padding: 10px 20px;
  border: none;
  background: none;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-light);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: var(--transition);
  white-space: nowrap;
}

.tab-btn:hover { color: var(--primary); }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

.tab-content { display: none; }
.tab-content.active { display: block; animation: fadeIn 0.3s ease; }

/* Chart container */
.chart-container {
  position: relative;
  width: 100%;
  max-width: 100%;
}

.chart-container canvas {
  max-height: 350px;
}

/* Holland Code bars */
.holland-bar-container { margin-bottom: 12px; }

.holland-bar-label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 4px;
}

.holland-bar {
  height: 24px;
  background: var(--border);
  border-radius: 12px;
  overflow: hidden;
}

.holland-bar-fill {
  height: 100%;
  border-radius: 12px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  transition: width 0.8s ease;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 10px;
  font-size: 11px;
  color: #fff;
  font-weight: 600;
}

/* Career match */
.career-card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
  transition: var(--transition);
}

.career-card:hover { background: rgba(21,101,192,0.05); }

.match-circle {
  width: 56px; height: 56px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  flex-shrink: 0;
}

.match-high { background: rgba(46,125,50,0.15); color: var(--success); }
.match-mid { background: rgba(245,127,23,0.15); color: var(--warning); }
.match-low { background: rgba(198,40,40,0.15); color: var(--danger); }

.career-info h4 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.career-info p { font-size: 12px; color: var(--text-light); }

/* Timeline */
.timeline { position: relative; padding-left: 24px; }
.timeline::before {
  content: '';
  position: absolute;
  left: 8px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--border);
}

.timeline-item {
  position: relative;
  margin-bottom: 20px;
  padding-left: 20px;
}

.timeline-item::before {
  content: '';
  position: absolute;
  left: -20px;
  top: 4px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--primary);
  border: 2px solid var(--card);
  box-shadow: 0 0 0 2px var(--primary);
}

.timeline-item h4 { font-size: 14px; font-weight: 600; }
.timeline-item p { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.timeline-item .date { font-size: 11px; color: var(--accent); font-weight: 600; }

/* Responsive */
@media (max-width: 768px) {
  .sidebar {
    transform: translateX(-100%);
  }
  .sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
  .main-content { margin-left: 0; }
  .menu-toggle { display: block; }
  .navbar-brand { min-width: auto; }
  .grid-2 { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .profile-header { flex-direction: column; text-align: center; }
  .info-grid { grid-template-columns: 1fr; }
  .modal { width: 95vw; }
}

/* Pagination */
.pagination {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 16px;
  justify-content: center;
}

.pagination button {
  padding: 6px 12px;
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: var(--transition);
}

.pagination button:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
.pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-light); }

function r(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function loadData() {

  saveData(data);
  return data;
}

function buildSidebar() {
  const menu = MENU_CONFIG[currentUser.role] || [];
  const ul = document.getElementById('sidebarMenu');
  ul.innerHTML = menu.map(m =>
    `<li><a href="#" data-page="${m.id}" onclick="navigateTo('${m.id}'); return false;">
      <span class="icon">${m.icon}</span> ${m.label}
    </a></li>`
  ).join('');
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function navigateTo(pageId) {
  currentPage = pageId;
  // Update sidebar active
  document.querySelectorAll('.sidebar-menu a').forEach(a => {
    a.classList.toggle('active', a.dataset.page === pageId);
  });
  // Close sidebar on mobile
  document.getElementById('sidebar').classList.remove('open');
  // Destroy old charts
  Object.values(chartInstances).forEach(c => { try { c.destroy(); } catch(e){} });
  chartInstances = {};
  // Render page
  renderPage(pageId);
}

}

function showStudentAcademics() {
  const id = parseInt(document.getElementById('acadStudentSelect').value);
  const s = appData.students.find(st => st.id === id);
  document.getElementById('acadContent').innerHTML = s ? renderStudentAcademics(s) : '<div class="card"><p class="text-center" style="color:var(--text-light);">Pilih siswa untuk melihat data akademik</p></div>';
  if (s) setTimeout(() => initAcademicsCharts(s), 50);
}

function filterAcademics() {
  const search = document.getElementById('acadSearch').value.toLowerCase();
  const cls = document.getElementById('acadClassFilter').value;
  const sel = document.getElementById('acadStudentSelect');
  const students = getAllStudents().filter(s => {
    if (cls && s.class !== cls) return false;
    if (search && !s.name.toLowerCase().includes(search)) return false;
    return true;
  });
  sel.innerHTML = '<option value="">Pilih Siswa</option>' + students.map(s => `<option value="${s.id}">${s.name} (${s.class})</option>`).join('');
}

function switchTab(btn, tabId) {
  const parent = btn.closest('.tabs').parentElement;
  parent.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  parent.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(tabId).classList.add('active');
  // Re-init charts if needed
  const s = getSelectedStudent();
  if (s && tabId === 'tabKehadiran') setTimeout(() => initAttendanceChart(s), 50);
  if (s && tabId === 'tabGrafik') setTimeout(() => initGradeProgressChart(s), 50);
}

function getSelectedStudent() {
  const sel = document.getElementById('acadStudentSelect');
  if (sel && sel.value) return appData.students.find(s => s.id === parseInt(sel.value));
  return getMyStudent();
}

// CRUD for achievements
function addAchievement(sid) {
  openModal('Tambah Prestasi', `
    <div class="form-group"><label>Jenis</label><select id="aaType"><option>Akademik</option><option>Non-Akademik</option></select></div>
    <div class="form-group"><label>Judul</label><input type="text" id="aaTitle" placeholder="Judul prestasi"></div>
    <div class="gap-row">
      <div class="form-group"><label>Tingkat</label><select id="aaLevel"><option>Sekolah</option><option>Kecamatan</option><option>Kabupaten</option><option>Provinsi</option><option>Nasional</option><option>Internasional</option></select></div>
      <div class="form-group"><label>Tahun</label><input type="text" id="aaYear" value="2025"></div>
    </div>
  `, () => {
    const s = appData.students.find(st => st.id === sid);
    const maxId = s.achievements.reduce((a, x) => Math.max(a, x.id), 0);
    s.achievements.push({ id: maxId + 1, type: document.getElementById('aaType').value, title: document.getElementById('aaTitle').value, level: document.getElementById('aaLevel').value, year: document.getElementById('aaYear').value });
    saveData(appData); closeModal(); showStudentAchievements(); showToast('Prestasi ditambahkan!', 'success');
  });
}

function deleteAchievement(sid, aid) {
  const s = appData.students.find(st => st.id === sid);
  s.achievements = s.achievements.filter(a => a.id !== aid);
  saveData(appData); showStudentAchievements(); showToast('Prestasi dihapus.', 'info');
}

function addCertificate(sid) {
  openModal('Tambah Sertifikat', `
    <div class="form-group"><label>Nama Sertifikat</label><input type="text" id="acName"></div>
    <div class="gap-row">
      <div class="form-group"><label>Instansi Penerbit</label><input type="text" id="acIssuer"></div>
      <div class="form-group"><label>Tahun</label><input type="text" id="acYear" value="2025"></div>
    </div>
  `, () => {
    const s = appData.students.find(st => st.id === sid);

function calculateCareerMatch(s) {
  const topHolland = Object.entries(s.hollandCode).sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => x[0]);
  const avgGrade = getStudentAvg(s);
  return CAREERS.map(c => {
    let match = 0;
    // Holland match (60% weight)
    const hLetters = c.riasec.split('');
    const hMatch = hLetters.filter(l => topHolland.includes(l)).length / hLetters.length;
    match += hMatch * 60;
    // Academic performance (20% weight)
    match += (avgGrade / 100) * 20;
    // MI bonus (20% weight)
    const miValues = Object.values(s.multipleIntelligence);
    const miAvg = miValues.reduce((a, b) => a + b, 0) / miValues.length;
    match += (miAvg / 100) * 20;
    return { ...c, match: Math.min(Math.round(match), 99) };
  }).sort((a, b) => b.match - a.match);
}

function renderStudentCareer(s) {
  if (!s) return '';
  const careers = calculateCareerMatch(s);
  const top3 = careers.slice(0, 3);
  const topHolland = Object.entries(s.hollandCode).sort((a, b) => b[1] - a[1])[0];
  const topMI = Object.entries(s.multipleIntelligence).sort((a, b) => b[1] - a[1])[0];
  return `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon">🎯</div><div class="stat-info"><div class="stat-value">${RIASEC[topHolland[0]].name}</div><div class="stat-label">Minat Dominan (Holland)</div></div></div>
      <div class="stat-card green"><div class="stat-icon">🧠</div><div class="stat-info"><div class="stat-value">${topMI[0]}</div><div class="stat-label">Kecerdasan Dominan</div></div></div>
      <div class="stat-card amber"><div class="stat-icon">📊</div><div class="stat-info"><div class="stat-value">${getStudentAvg(s).toFixed(1)}</div><div class="stat-label">Rata-rata Akademik</div></div></div>
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="card-title">🏆 Top 3 Rekomendasi Profesi</div>
        ${top3.map(c => `
          <div class="career-card">
            <div class="match-circle ${c.match >= 70 ? 'match-high' : c.match >= 50 ? 'match-mid' : 'match-low'}">${c.match}%</div>
            <div class="career-info">
              <h4>${c.name}</h4>
              <p>${c.desc}</p>
              <p style="margin-top:4px;"><span class="badge badge-blue">RIASEC: ${c.riasec}</span> <span class="badge badge-green">Skills: ${c.skills.join(', ')}</span></p>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="card">
        <div class="card-title">📊 Skill Gap Analysis</div>
        <div class="chart-container"><canvas id="chartSkillGap"></canvas></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">📋 Semua Rekomendasi Karir</div>
      <div class="table-container">
        <table>
          <thead><tr><th>Profesi</th><th>Deskripsi</th><th>RIASEC</th><th>Match</th></tr></thead>
          <tbody>
            ${careers.map(c => `<tr>
              <td><strong>${c.name}</strong></td>
              <td>${c.desc}</td>
              <td><span class="badge badge-blue">${c.riasec}</span></td>
              <td><span class="badge ${c.match>=70?'badge-green':c.match>=50?'badge-amber':'badge-red'}">${c.match}%</span></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!confirm('Import akan menimpa data. Lanjutkan?')) return;
  const r = new FileReader();
  r.onload = function(e) {
    try {
      const d = JSON.parse(e.target.result);
      if (!d.students || !Array.isArray(d.students)) { showToast('File tidak valid!','error'); return; }
      saveData(d);
      showToast('Berhasil import '+d.students.length+' siswa!','success');
      navigateTo('master');
    } catch(err) { showToast('Error: '+err.message,'error'); }
  };
  r.readAsText(file);
}


function renderStudents() {
  return `
    <h2 class="page-title">Data Siswa</h2>
    <p class="page-subtitle">Daftar seluruh siswa dan informasi lengkap</p>
    <div class="toolbar">
      <div class="search-box"><input type="text" id="studentSearch" placeholder="Cari siswa..." oninput="filterStudentTable()"></div>
      <select id="studentClassFilter" onchange="filterStudentTable()">
        <option value="">Semua Kelas</option>
        ${[...new Set(getAllStudents().map(s=>s.class))].map(c=>`<option value="${c}">${c}</option>`).join('')}
      </select>
      <button class="btn btn-primary btn-sm" onclick="printPage()">🖨️ Cetak</button>
    </div>
    <div class="card">
      <div class="table-container">
        <table>
          <thead><tr><th>No</th><th>Nama</th><th>Kelas</th><th>NIS</th><th>JK</th><th>Rata-rata</th><th>Kehadiran</th><th>Holland</th><th>Aksi</th></tr></thead>
          <tbody id="studentTableBody">
            ${renderStudentRows(getAllStudents())}
          </tbody>
        </table>
      </div>
    </div>`;
}

function renderStudentRows(students) {
  return students.map((s, i) => `<tr>
    <td>${i+1}</td>
    <td><strong>${s.name}</strong></td>
    <td>${s.class}</td>
    <td>${s.nis}</td>
    <td>${s.gender === 'L' ? '♂️' : '♀️'}</td>
    <td><span class="badge ${getStudentAvg(s)>=80?'badge-green':getStudentAvg(s)>=70?'badge-amber':'badge-red'}">${getStudentAvg(s).toFixed(1)}</span></td>
    <td>${s.attendance.hadir}%</td>
    <td><span class="badge badge-blue">${getTopHolland(s)}</span></td>
    <td><button class="btn btn-sm btn-outline" onclick="viewStudentDetail(${s.id})">👁️ Detail</button></td>
  </tr>`).join('');
}

function filterStudentTable() {
  const search = document.getElementById('studentSearch').value.toLowerCase();
  const cls = document.getElementById('studentClassFilter').value;
  const filtered = getAllStudents().filter(s => {
    if (cls && s.class !== cls) return false;
    if (search && !s.name.toLowerCase().includes(search) && !s.nis.includes(search)) return false;
    return true;
  });
  document.getElementById('studentTableBody').innerHTML = renderStudentRows(filtered);
}

function viewStudentDetail(id) {
  const s = appData.students.find(st => st.id === id);
  if (!s) return;
  openModal(`Detail Siswa: ${s.name}`, `
    <div class="profile-header">
      <div class="profile-avatar" style="width:64px;height:64px;font-size:28px;">${s.photo}</div>
      <div class="profile-info"><h2 style="font-size:18px;">${s.name}</h2><p>${s.class} • NIS: ${s.nis}</p></div>
    </div>
    <div class="info-grid">
      <div class="info-item"><label>Rata-rata Nilai</label><span>${getStudentAvg(s).toFixed(1)}</span></div>
      <div class="info-item"><label>Kehadiran</label><span>${s.attendance.hadir}%</span></div>
      <div class="info-item"><label>Holland Dominan</label><span>${getTopHolland(s)}</span></div>
      <div class="info-item"><label>MBTI</label><span>${s.mbti}</span></div>
      <div class="info-item"><label>Target Jurusan</label><span>${s.iacp.targetJurusan}</span></div>
      <div class="info-item"><label>Target Profesi</label><span>${s.iacp.targetProfesi}</span></div>
      <div class="info-item"><label>Total Prestasi</label><span>${s.achievements.length}</span></div>
      <div class="info-item"><label>Sertifikat</label><span>${s.certificates.length}</span></div>
    </div>
  `, `<button class="btn btn-outline" onclick="closeModal()">Tutup</button>`);
}

// ===================== COUNSELING =====================
function renderCounseling() {
  return `
    <h2 class="page-title">Catatan Konseling</h2>
    <p class="page-subtitle">Manajemen catatan konseling siswa</p>
    <div class="toolbar">
      <select id="counselStudentSelect">
        <option value="">Pilih Siswa</option>
        ${getAllStudents().map(s => `<option value="${s.id}">${s.name} (${s.class})</option>`).join('')}
      </select>
      <button class="btn btn-primary btn-sm" onclick="addCounselingNote()">+ Tambah Catatan</button>
    </div>
    <div class="card">
      <div class="table-container">
        <table>
          <thead><tr><th>Siswa</th><th>Tanggal</th><th>Kategori</th><th>Catatan</th><th>Aksi</th></tr></thead>
          <tbody id="counselingTableBody">
            ${renderCounselingRows()}
          </tbody>
        </table>
      </div>
    </div>`;
}

function renderCounselingRows() {
  const all = getAllStudents().flatMap(s => s.counselingNotes.map(n => ({ ...n, studentName: s.name, studentId: s.id })));
  if (all.length === 0) return '<tr><td colspan="5" class="text-center" style="color:var(--text-light);">Belum ada catatan konseling</td></tr>';
  return all.sort((a, b) => b.date.localeCompare(a.date)).map(n => `<tr>
    <td>${n.studentName}</td><td>${n.date}</td><td><span class="badge badge-blue">${n.category}</span></td><td>${n.note}</td>
    <td><button class="btn btn-sm btn-danger" onclick="deleteCounselingNote(${n.studentId},'${n.date}')">🗑️</button></td>
  </tr>`).join('');
}

function addCounselingNote() {
  const sid = parseInt(document.getElementById('counselStudentSelect').value);
  if (!sid) { showToast('Pilih siswa terlebih dahulu!', 'error'); return; }
  openModal('Tambah Catatan Konseling', `
    <div class="form-group"><label>Kategori</label><select id="cnCat"><option>Akademik</option><option>Personal</option><option>Karir</option><option>Sosial</option><option>Keluarga</option></select></div>
    <div class="form-group"><label>Catatan</label><textarea id="cnNote" placeholder="Isi catatan konseling..."></textarea></div>
  `, () => {
    const s = appData.students.find(st => st.id === sid);
    s.counselingNotes.push({ date: new Date().toISOString().split('T')[0], category: document.getElementById('cnCat').value, note: document.getElementById('cnNote').value });
    saveData(appData); closeModal(); navigateTo('counseling'); showToast('Catatan konseling ditambahkan!', 'success');
  });
}

function deleteCounselingNote(sid, date) {
  const s = appData.students.find(st => st.id === sid);
  s.counselingNotes = s.counselingNotes.filter(n => n.date !== date);
  saveData(appData); navigateTo('counseling'); showToast('Catatan dihapus.', 'info');
}

// ===================== HELPER FUNCTIONS =====================
function getStudentAvg(s) {
  const avgs = SUBJECTS.map(sub => {
    const g = s.grades[sub];
    return (g.tugas + g.uts + g.uas) / 3;
  });
  return avgs.reduce((a, b) => a + b, 0) / avgs.length;
}

function getTopHolland(s) {
  const sorted = Object.entries(s.hollandCode).sort((a, b) => b[1] - a[1]);
  return sorted.slice(0, 2).map(x => x[0]).join('');
}

function getTopMI(s) {
  const sorted = Object.entries(s.multipleIntelligence).sort((a, b) => b[1] - a[1]);
  return sorted[0][0];
}

function renderIACPProgress(s) {
  const targetAvg = Object.values(s.iacp.targetNilai).reduce((a, b) => a + b, 0) / Object.values(s.iacp.targetNilai).length;
  const actualAvg = getStudentAvg(s);
  const progress = Math.min(Math.round((actualAvg / targetAvg) * 100), 100);
  return `
    <div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;font-size:13px;">
        <span>Target Rata-rata: ${targetAvg.toFixed(1)}</span><span>Actual: ${actualAvg.toFixed(1)}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill ${progress>=80?'green':'amber'}" style="width:${progress}%"></div></div>
      <div style="text-align:center;font-size:12px;color:var(--text-light);">${progress}% tercapai</div>
    </div>
    <div style="margin-top:16px;">
      <strong style="font-size:13px;">📅 Timeline Mendatang:</strong>
      ${s.iacp.timeline.slice(0, 2).map(t => `<div style="padding:8px;background:var(--bg);border-radius:6px;margin-top:8px;font-size:12px;">
        <span style="color:var(--accent);font-weight:600;">${t.date}</span> — ${t.desc}
      </div>`).join('')}
    </div>`;
}

// ===================== MODAL SYSTEM =====================
function openModal(title, bodyHtml, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooter').innerHTML = `
    <button class="btn btn-outline" onclick="closeModal()">Batal</button>
    <button class="btn btn-primary" id="modalConfirmBtn">💾 Simpan</button>`;
  document.getElementById('modalOverlay').classList.add('show');
  if (onConfirm) {
    document.getElementById('modalConfirmBtn').onclick = onConfirm;
  }
  // If custom footer
  if (typeof onConfirm === 'string') {
    document.getElementById('modalFooter').innerHTML = onConfirm;
  }
}

function closeModal(id) {
  if (id) {
    const m = document.getElementById(id);
    if (m) m.remove();
  } else {
    const m = document.getElementById('modalOverlay');
    if (m) m.classList.remove('show');
  }
}

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ===================== TOAST SYSTEM =====================
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
  toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> ${message}`;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)'; setTimeout(() => toast.remove(), 300); }, 3000);
}

function printPage() { window.print(); }

// ===================== CHART INITIALIZATION =====================
const chartColors = ['#1565C0','#42A5F5','#0D47A1','#2E7D32','#F57F17','#C62828','#6A1B9A','#00838F','#EF6C00','#4E342E'];

function initPageCharts(pageId) {
  if (pageId === 'dashboard') initDashboardCharts();
  // Other pages init charts on demand
}

function initDashboardCharts() {
  const role = currentUser.role;
  if (role === 'Siswa') {
    const s = getMyStudent();
    if (s) {
      initBarChart('chartStudentGrades', SUBJECTS, SUBJECTS.map(sub => {
        const g = s.grades[sub]; return +((g.tugas + g.uts + g.uas) / 3).toFixed(1);
      }), 'Rata-rata Nilai');
      initRadarChart('chartStudentMI', MI_TYPES, MI_TYPES.map(t => s.multipleIntelligence[t]));
      // Career recs
      const careers = calculateCareerMatch(s).slice(0, 3);
      document.getElementById('dashboardCareerRecs').innerHTML = careers.map(c => `
        <div class="career-card">
          <div class="match-circle ${c.match>=70?'match-high':c.match>=50?'match-mid':'match-low'}">${c.match}%</div>
          <div class="career-info"><h4>${c.name}</h4><p>${c.desc}</p></div>
        </div>`).join('');
    }
  } else if (role === 'Guru' || role === 'Admin') {
    const prefix = role === 'Admin' ? 'Admin' : '';
    const classes = [...new Set(getAllStudents().map(s => s.class))];
    const classAvgs = classes.map(c => {
      const cs = getAllStudents().filter(s => s.class === c);
      return +(cs.reduce((a, s) => a + getStudentAvg(s), 0) / cs.length).toFixed(1);
    });
    const classAtt = classes.map(c => {
      const cs = getAllStudents().filter(s => s.class === c);
      return +(cs.reduce((a, s) => a + s.attendance.hadir, 0) / cs.length).toFixed(1);
    });
    initBarChart(`chart${prefix}ClassAvg`, classes, classAvgs, 'Rata-rata Nilai');
    initBarChart(`chart${prefix}ClassAttendance`, classes, classAtt, 'Kehadiran (%)');
    if (role === 'Admin') {
      // Achievement chart
      const levels = ['Sekolah','Kecamatan','Kabupaten','Provinsi','Nasional','Internasional'];
      const levelCounts = levels.map(l => getAllStudents().reduce((a, s) => a + s.achievements.filter(x => x.level === l).length, 0));
      initBarChart('chartAdminAchievement', levels, levelCounts, 'Jumlah Prestasi');
      // Holland distribution
      const hollandKeys = Object.keys(RIASEC);
      const hollandAvg = hollandKeys.map(k => +(getAllStudents().reduce((a, s) => a + s.hollandCode[k], 0) / getAllStudents().length).toFixed(1));
      initBarChart('chartAdminHolland', hollandKeys.map(k => `${k}-${RIASEC[k].name}`), hollandAvg, 'Rata-rata Skor');
    }
  } else if (role === 'Guru BK') {
    const hollandKeys = Object.keys(RIASEC);
    const hollandAvg = hollandKeys.map(k => +(getAllStudents().reduce((a, s) => a + s.hollandCode[k], 0) / getAllStudents().length).toFixed(1));
    initBarChart('chartHollandDist', hollandKeys.map(k => `${k}-${RIASEC[k].name}`), hollandAvg, 'Rata-rata Skor');
    initBarChart('chartMIOverview', getAllStudents().map(s => s.name.split(' ')[0]), getAllStudents().map(s => {
      const vals = Object.values(s.multipleIntelligence);
      return +(vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1);
    }), 'Rata-rata MI');
  } else if (role === 'Pembina') {
    const levels = ['Sekolah','Kecamatan','Kabupaten','Provinsi','Nasional','Internasional'];
    const levelCounts = levels.map(l => getAllStudents().reduce((a, s) => a + s.achievements.filter(x => x.level === l).length, 0));
    initBarChart('chartAchievementLevel', levels, levelCounts, 'Jumlah Prestasi');
  }
}

function initAcademicsCharts(s) {
  initAttendanceChart(s);
  initGradeProgressChart(s);
}

function initAttendanceChart(s) {
  if (chartInstances.attendancePie) chartInstances.attendancePie.destroy();
  const ctx = document.getElementById('chartAttendancePie');
  if (!ctx) return;
  chartInstances.attendancePie = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['Hadir', 'Izin', 'Sakit', 'Alpha'],
      datasets: [{ data: [s.attendance.hadir, s.attendance.izin, s.attendance.sakit, s.attendance.alpha], backgroundColor: ['#2E7D32','#42A5F5','#F57F17','#C62828'] }]
    },
    options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
  });
}

function initGradeProgressChart(s) {
  if (chartInstances.gradeProgress) chartInstances.gradeProgress.destroy();
  const ctx = document.getElementById('chartGradeProgress');
  if (!ctx) return;
  const labels = ['Harian 1','Harian 2','Harian 3','Harian 4','Harian 5'];
  const datasets = SUBJECTS.slice(0, 5).map((sub, i) => ({
    label: sub,
    data: s.grades[sub].harian,
    borderColor: chartColors[i],
    backgroundColor: chartColors[i] + '20',
    tension: 0.4,
    fill: false
  }));
  chartInstances.gradeProgress = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: false, min: 40, max: 100 } } }
  });
}

function initTalentCharts(s) {
  initRadarChart('chartMI', MI_TYPES, MI_TYPES.map(t => s.multipleIntelligence[t]));
  initBarChart('chartHolland', Object.keys(RIASEC).map(k => `${k}-${RIASEC[k].name}`), Object.values(s.hollandCode), 'Skor (%)');
}

function initIACPCharts(s) {
  const chartSubs = SUBJECTS.slice(0, 6);
  const actual = chartSubs.map(sub => { const g = s.grades[sub]; return +((g.tugas + g.uts + g.uas) / 3).toFixed(1); });
  const target = chartSubs.map(sub => s.iacp.targetNilai[sub] || 80);
  if (chartInstances.iacpTarget) chartInstances.iacpTarget.destroy();
  const ctx = document.getElementById('chartIACPTarget');
  if (!ctx) return;
  chartInstances.iacpTarget = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: chartSubs,
      datasets: [
        { label: 'Nilai Aktual', data: actual, backgroundColor: '#42A5F5' },
        { label: 'Target', data: target, backgroundColor: '#2E7D32' }
      ]
    },
    options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: false, min: 50, max: 100 } } }
  });
}

function initCareerCharts(s) {
  const careers = calculateCareerMatch(s).slice(0, 6);
  const topCareer = careers[0];
  // Skill gap chart
  if (chartInstances.skillGap) chartInstances.skillGap.destroy();
  const ctx = document.getElementById('chartSkillGap');
  if (!ctx) return;
  const skills = topCareer.skills;
  const skillLevels = skills.map(() => r(50, 90));
  const required = skills.map(() => r(75, 95));
  chartInstances.skillGap = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: skills,
      datasets: [
        { label: 'Level Saat Ini', data: skillLevels, borderColor: '#42A5F5', backgroundColor: 'rgba(66,165,245,0.2)' },
        { label: 'Dibutuhkan', data: required, borderColor: '#2E7D32', backgroundColor: 'rgba(46,125,50,0.2)' }
      ]
    },
    options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { r: { beginAtZero: true, max: 100 } } }
  });
}

function initBarChart(canvasId, labels, data, label) {
  if (chartInstances[canvasId]) chartInstances[canvasId].destroy();
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  chartInstances[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{ label, data, backgroundColor: labels.map((_, i) => chartColors[i % chartColors.length]), borderRadius: 6 }]
    },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });
}

function initRadarChart(canvasId, labels, data) {
  if (chartInstances[canvasId]) chartInstances[canvasId].destroy();
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  chartInstances[canvasId] = new Chart(ctx, {
    type: 'radar',
    data: {
      labels,
      datasets: [{ label: 'Skor', data, borderColor: '#1565C0', backgroundColor: 'rgba(21,101,192,0.15)', pointBackgroundColor: '#1565C0' }]
    },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { r: { beginAtZero: true, max: 100, ticks: { stepSize: 20 } } } }
  });
}
